apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudmonitor
  labels:
    app: cloudmonitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudmonitor
  template:
    metadata:
      labels:
        app: cloudmonitor
    spec:
      containers:
        - name: cloudmonitor
          image: cloudmonitor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
